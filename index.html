<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELL OFFICIAL | Digital Products & Services</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --light: #f8fafc;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }

        /* Utility Classes */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 600; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--secondary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .grid { display: grid; gap: 20px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

        /* Header */
        header { background: var(--white); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; padding: 15px 0; }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links li a { text-decoration: none; color: var(--dark); font-weight: 500; cursor: pointer; }
        .nav-links li a:hover, .nav-links li a.active { color: var(--primary); }

        /* Hero Section */
        .hero { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 60px 0; text-align: center; border-radius: 0 0 30px 30px; margin-bottom: 40px; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 15px; }
        .hero p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; margin: 0 auto 30px; }

        /* Cards */
        .card { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); transition: transform 0.3s; border: 1px solid #e2e8f0; }
        .card:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 180px; background: #e2e8f0; border-radius: var(--radius); margin-bottom: 15px; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--secondary); }
        .card-title { font-size: 1.2rem; margin-bottom: 8px; font-weight: 700; }
        .card-price { color: var(--primary); font-weight: 700; font-size: 1.1rem; }
        .card-desc { color: var(--secondary); font-size: 0.9rem; margin-bottom: 15px; }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--dark); }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        .form-control:focus { outline: 2px solid var(--primary); border-color: transparent; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: var(--white); padding: 30px; border-radius: var(--radius); width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--secondary); }

        /* Admin Dashboard */
        .admin-sidebar { position: fixed; left: 0; top: 0; height: 100vh; width: 250px; background: var(--dark); color: white; padding: 20px; overflow-y: auto; z-index: 90; }
        .admin-main { margin-left: 250px; padding: 30px; }
        .admin-menu-item { padding: 12px 15px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; transition: background 0.2s; }
        .admin-menu-item:hover, .admin-menu-item.active { background: rgba(255,255,255,0.1); }
        .stat-card { background: white; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--primary); }
        
        /* Tables */
        .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .data-table th { background: #f1f5f9; font-weight: 600; }
        .data-table tr:hover { background: #f8fafc; }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); transition: transform 0.3s; }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; }
            .nav-links { display: none; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container nav-wrapper">
            <a href="#" class="logo" onclick="showPage('home')">SELL OFFICIAL</a>
            <ul class="nav-links">
                <li><a onclick="showPage('home')">Home</a></li>
                <li><a onclick="showPage('products')">Products</a></li>
                <li><a onclick="showPage('services')">Services</a></li>
                <li><a onclick="checkAuthForPage('orders')">My Orders</a></li>
                <li><a onclick="openAuthModal()" id="authLink">Login</a></li>
            </ul>
            <button class="btn btn-primary mobile-only" onclick="openAuthModal()"><i class="fas fa-user"></i></button>
        </div>
    </header>

    <!-- Pages Container -->
    <main id="app"></main>

    <!-- Footer -->
    <footer style="background: var(--dark); color: white; padding: 40px 0; margin-top: 60px; text-align: center;">
        <div class="container">
            <h3>SELL OFFICIAL</h3>
            <p>Websites • Apps • Source Code • Digital Services</p>
            <div style="margin-top: 20px; font-size: 0.9rem; opacity: 0.7;">
                &copy; 2026 Sell Official. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Auth Modal -->
    <div id="authModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('authModal')">&times;</span>
            <h2 class="text-center" style="margin-bottom: 20px;">🔐 Account Access</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="authEmail" class="form-control" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPass" class="form-control" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" style="width: 100%" onclick="handleLogin()">Login / Register</button>
            <p class="text-center" style="margin-top: 15px; font-size: 0.9rem; color: var(--secondary);">
                Admin Email: jblsongrimix999@gmail.com
            </p>
        </div>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('orderModal')">&times;</span>
            <h2 id="orderModalTitle">Place Order</h2>
            <div id="orderFormContent"></div>
        </div>
    </div>

    <script>
        // --- DATA & STATE MANAGEMENT ---
        const ADMIN_EMAIL = "jblsongrimix999@gmail.com"; // Admin Email Configuration

        const DB = {
            products: JSON.parse(localStorage.getItem('so_products')) || [],
            services: JSON.parse(localStorage.getItem('so_services')) || [],
            orders: JSON.parse(localStorage.getItem('so_orders')) || [],
            users: JSON.parse(localStorage.getItem('so_users')) || [],
            settings: JSON.parse(localStorage.getItem('so_settings')) || {
                whatsapp: '01845077415',
                telegram: 'https://t.me/sellofficial',
                bkash: '01845077415',
                nagad: '01845077415',
                rocket: '01845077415'
            }
        };

        let currentUser = JSON.parse(localStorage.getItem('so_current_user')) || null;

        // Initialize Default Data if Empty
        if (DB.services.length === 0) {
            const defaultServices = [
                { id: 1, name: 'Custom Website Development', category: 'Web', price: 5000, icon: '🌐', desc: 'WordPress, React, or Custom PHP website.' },
                { id: 2, name: 'Android App Development', category: 'App', price: 10000, icon: '📱', desc: 'Native Android or Flutter app development.' },
                { id: 3, name: 'UI/UX Design', category: 'Design', price: 3000, icon: '🎨', desc: 'Modern app and website interface design.' },
                { id: 4, name: 'Bug Fixing & Support', category: 'Support', price: 1000, icon: '🐛', desc: 'Fix errors in your existing code.' },
                { id: 5, name: 'API Integration', category: 'Backend', price: 4000, icon: '🔌', desc: 'Connect third-party APIs to your system.' },
                { id: 6, name: 'SEO Optimization', category: 'Marketing', price: 2500, icon: '🚀', desc: 'Rank your website higher on Google.' }
            ];
            DB.services = defaultServices;
            saveData();
        }

        function saveData() {
            localStorage.setItem('so_products', JSON.stringify(DB.products));
            localStorage.setItem('so_services', JSON.stringify(DB.services));
            localStorage.setItem('so_orders', JSON.stringify(DB.orders));
            localStorage.setItem('so_users', JSON.stringify(DB.users));
            localStorage.setItem('so_settings', JSON.stringify(DB.settings));
        }

        // --- NAVIGATION & ROUTING ---
        function showPage(pageId, params = null) {
            const app = document.getElementById('app');
            window.scrollTo(0,0);
            
            if (pageId === 'home') renderHome(app);
            else if (pageId === 'products') renderProducts(app);
            else if (pageId === 'services') renderServices(app);
            else if (pageId === 'orders') renderUserOrders(app);
            else if (pageId === 'admin') renderAdmin(app, params);
        }

        function checkAuthForPage(page) {
            if (!currentUser) {
                openAuthModal();
            } else {
                showPage(page);
            }
        }

        // --- RENDER FUNCTIONS ---

        function renderHome(container) {
            container.innerHTML = `
                <section class="hero">
                    <div class="container">
                        <h1>Build. Buy. Grow.</h1>
                        <p>Your one-stop shop for Websites, Apps, Source Codes, and Digital Services.</p>
                        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                            <button class="btn btn-white" style="background: white; color: var(--primary)" onclick="showPage('products')">🛒 Browse Products</button>
                            <button class="btn btn-secondary" style="background: rgba(255,255,255,0.2); color: white" onclick="showPage('services')">🛠️ View Services</button>
                        </div>
                    </div>
                </section>

                <div class="container">
                    <div class="grid grid-3" style="margin-bottom: 40px;">
                        <div class="card text-center">
                            <h3>${DB.products.length + DB.services.length}+</h3>
                            <p>Digital Assets</p>
                        </div>
                        <div class="card text-center">
                            <h3>${DB.orders.length}</h3>
                            <p>Orders Completed</p>
                        </div>
                        <div class="card text-center">
                            <h3>24/7</h3>
                            <p>Support</p>
                        </div>
                    </div>

                    <h2 style="margin-bottom: 20px;">🔥 Featured Services</h2>
                    <div class="grid grid-3" id="homeServicesGrid"></div>
                    
                    <div class="text-center" style="margin-top: 30px;">
                        <button class="btn btn-primary" onclick="showPage('services')">View All Services</button>
                    </div>
                </div>
            `;
            
            const grid = document.getElementById('homeServicesGrid');
            DB.services.slice(0, 3).forEach(s => {
                grid.innerHTML += createServiceCard(s);
            });
        }

        function renderProducts(container) {
            container.innerHTML = `
                <div class="container" style="padding-top: 40px;">
                    <h2 style="margin-bottom: 20px;">🛒 Digital Products</h2>
                    <div class="grid grid-3" id="productsGrid">
                        ${DB.products.length === 0 ? '<p>No products available yet.</p>' : ''}
                    </div>
                </div>
            `;
            const grid = document.getElementById('productsGrid');
            DB.products.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img"><i class="fas fa-box"></i></div>
                        <h3 class="card-title">${p.name}</h3>
                        <p class="card-desc">${p.desc || 'High quality digital product'}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="card-price">৳${p.price}</span>
                            <button class="btn btn-primary btn-sm" onclick="openOrderModal('product', ${p.id})">Buy Now</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderServices(container) {
            container.innerHTML = `
                <div class="container" style="padding-top: 40px;">
                    <h2 style="margin-bottom: 20px;">🛠️ Development Services</h2>
                    <div class="grid grid-3" id="servicesGrid"></div>
                </div>
            `;
            const grid = document.getElementById('servicesGrid');
            DB.services.forEach(s => {
                grid.innerHTML += createServiceCard(s);
            });
        }

        function createServiceCard(s) {
            return `
                <div class="card">
                    <div class="card-img" style="font-size: 4rem;">${s.icon}</div>
                    <h3 class="card-title">${s.name}</h3>
                    <p class="card-desc">${s.desc}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="card-price">From ৳${s.price}</span>
                        <button class="btn btn-primary btn-sm" onclick="openOrderModal('service', ${s.id})">Order Now</button>
                    </div>
                </div>
            `;
        }

        function renderUserOrders(container) {
            if (!currentUser) return showPage('home');
            
            const myOrders = DB.orders.filter(o => o.userEmail === currentUser.email);
            
            container.innerHTML = `
                <div class="container" style="padding-top: 40px;">
                    <h2 style="margin-bottom: 20px;">📦 My Orders</h2>
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Item</th>
                                    <th>Type</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${myOrders.length === 0 ? '<tr><td colspan="6" class="text-center">No orders found.</td></tr>' : ''}
                                ${myOrders.map(o => `
                                    <tr>
                                        <td>#${o.id}</td>
                                        <td>${o.itemName}</td>
                                        <td>${o.type}</td>
                                        <td>৳${o.amount}</td>
                                        <td><span class="btn btn-sm ${o.status === 'Pending' ? 'btn-warning' : 'btn-success'}" style="padding: 4px 8px; font-size: 0.8rem;">${o.status}</span></td>
                                        <td>${new Date(o.date).toLocaleDateString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- ADMIN PANEL ---
        function renderAdmin(container, tab = 'dashboard') {
            // Security Check: Only allow specific admin email
            if (!currentUser || currentUser.email !== ADMIN_EMAIL) {
                alert('Access Denied. Admin privileges required.');
                return showPage('home');
            }

            container.innerHTML = `
                <div class="admin-sidebar">
                    <h3 style="margin-bottom: 30px; padding-left: 15px;">⚙️ Admin Panel</h3>
                    <div class="admin-menu-item ${tab === 'dashboard' ? 'active' : ''}" onclick="showPage('admin', 'dashboard')"><i class="fas fa-chart-line"></i> Dashboard</div>
                    <div class="admin-menu-item ${tab === 'products' ? 'active' : ''}" onclick="showPage('admin', 'products')"><i class="fas fa-box"></i> Products</div>
                    <div class="admin-menu-item ${tab === 'services' ? 'active' : ''}" onclick="showPage('admin', 'services')"><i class="fas fa-tools"></i> Services</div>
                    <div class="admin-menu-item ${tab === 'orders' ? 'active' : ''}" onclick="showPage('admin', 'orders')"><i class="fas fa-shopping-cart"></i> Orders</div>
                    <div class="admin-menu-item ${tab === 'settings' ? 'active' : ''}" onclick="showPage('admin', 'settings')"><i class="fas fa-cog"></i> Settings</div>
                    <div class="admin-menu-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
                </div>
                <div class="admin-main">
                    <div id="adminContent"></div>
                </div>
            `;

            const content = document.getElementById('adminContent');
            
            if (tab === 'dashboard') {
                content.innerHTML = `
                    <h2>Dashboard Overview</h2>
                    <div class="grid grid-4" style="margin-top: 20px;">
                        <div class="stat-card"><div class="stat-number">${DB.products.length}</div><div>Products</div></div>
                        <div class="stat-card"><div class="stat-number">${DB.services.length}</div><div>Services</div></div>
                        <div class="stat-card"><div class="stat-number">${DB.orders.length}</div><div>Orders</div></div>
                        <div class="stat-card"><div class="stat-number">${DB.users.length}</div><div>Users</div></div>
                    </div>
                `;
            } else if (tab === 'products') {
                content.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2>Manage Products</h2>
                        <button class="btn btn-primary" onclick="adminAddProduct()">+ Add Product</button>
                    </div>
                    <table class="data-table">
                        <thead><tr><th>Name</th><th>Price</th><th>Action</th></tr></thead>
                        <tbody>
                            ${DB.products.map(p => `
                                <tr>
                                    <td>${p.name}</td>
                                    <td>৳${p.price}</td>
                                    <td><button class="btn btn-danger btn-sm" onclick="adminDeleteProduct(${p.id})">Delete</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (tab === 'services') {
                content.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2>Manage Services</h2>
                        <button class="btn btn-primary" onclick="adminAddService()">+ Add Service</button>
                    </div>
                    <table class="data-table">
                        <thead><tr><th>Name</th><th>Price</th><th>Action</th></tr></thead>
                        <tbody>
                            ${DB.services.map(s => `
                                <tr>
                                    <td>${s.name}</td>
                                    <td>৳${s.price}</td>
                                    <td><button class="btn btn-danger btn-sm" onclick="adminDeleteService(${s.id})">Delete</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (tab === 'orders') {
                content.innerHTML = `
                    <h2>All Orders</h2>
                    <table class="data-table" style="margin-top: 20px;">
                        <thead><tr><th>ID</th><th>Customer</th><th>Item</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            ${DB.orders.map(o => `
                                <tr>
                                    <td>#${o.id}</td>
                                    <td>${o.userEmail}</td>
                                    <td>${o.itemName}</td>
                                    <td>৳${o.amount}</td>
                                    <td>${o.status}</td>
                                    <td>
                                        <button class="btn btn-success btn-sm" onclick="adminUpdateOrder(${o.id}, 'Completed')">✓</button>
                                        <button class="btn btn-warning btn-sm" onclick="adminUpdateOrder(${o.id}, 'Pending')">!</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (tab === 'settings') {
                content.innerHTML = `
                    <h2>Store Settings</h2>
                    <div class="card" style="margin-top: 20px; max-width: 600px;">
                        <div class="form-group">
                            <label>WhatsApp Number</label>
                            <input type="text" id="setWa" class="form-control" value="${DB.settings.whatsapp}">
                        </div>
                        <div class="form-group">
                            <label>bKash Number</label>
                            <input type="text" id="setBkash" class="form-control" value="${DB.settings.bkash}">
                        </div>
                        <button class="btn btn-primary" onclick="saveSettings()">Save Changes</button>
                    </div>
                `;
            }
        }

        // --- ADMIN ACTIONS ---
        function adminAddProduct() {
            const name = prompt("Product Name:");
            if(!name) return;
            const price = prompt("Price:");
            DB.products.push({ id: Date.now(), name, price, desc: 'New Product' });
            saveData();
            showPage('admin', 'products');
        }

        function adminDeleteProduct(id) {
            if(confirm('Delete this product?')) {
                DB.products = DB.products.filter(p => p.id !== id);
                saveData();
                showPage('admin', 'products');
            }
        }

        function adminAddService() {
            const name = prompt("Service Name:");
            if(!name) return;
            const price = prompt("Starting Price:");
            const icon = prompt("Icon (Emoji):", "🛠️");
            DB.services.push({ id: Date.now(), name, price, icon, desc: 'New Service' });
            saveData();
            showPage('admin', 'services');
        }

        function adminDeleteService(id) {
            if(confirm('Delete this service?')) {
                DB.services = DB.services.filter(s => s.id !== id);
                saveData();
                showPage('admin', 'services');
            }
        }

        function adminUpdateOrder(id, status) {
            const order = DB.orders.find(o => o.id === id);
            if(order) {
                order.status = status;
                saveData();
                showPage('admin', 'orders');
            }
        }

        function saveSettings() {
            DB.settings.whatsapp = document.getElementById('setWa').value;
            DB.settings.bkash = document.getElementById('setBkash').value;
            saveData();
            alert('Settings Saved!');
        }

        // --- ORDERING SYSTEM ---
        function openOrderModal(type, id) {
            const item = type === 'service' ? DB.services.find(i => i.id === id) : DB.products.find(i => i.id === id);
            if(!item) return;

            const modal = document.getElementById('orderModal');
            const content = document.getElementById('orderFormContent');
            document.getElementById('orderModalTitle').innerText = `Order: ${item.name}`;

            content.innerHTML = `
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="ordName" class="form-control" value="${currentUser ? currentUser.name : ''}">
                </div>
                <div class="form-group">
                    <label>Phone / WhatsApp</label>
                    <input type="text" id="ordPhone" class="form-control" value="${currentUser ? currentUser.phone : ''}">
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="ordMethod" class="form-control">
                        <option value="bKash">bKash (${DB.settings.bkash})</option>
                        <option value="Nagad">Nagad (${DB.settings.nagad})</option>
                        <option value="Rocket">Rocket (${DB.settings.rocket})</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Transaction ID (TrxID)</label>
                    <input type="text" id="ordTrx" class="form-control" placeholder="Enter TrxID after payment">
                </div>
                <div class="form-group">
                    <label>Amount Paid</label>
                    <input type="number" id="ordAmount" class="form-control" value="${item.price}">
                </div>
                <button class="btn btn-success" style="width: 100%" onclick="submitOrder('${type}', ${item.id}, '${item.name}', ${item.price})">Confirm Order</button>
            `;
            
            modal.classList.remove('hidden');
        }

        function submitOrder(type, id, name, price) {
            if(!currentUser) {
                alert('Please login first!');
                closeModal('orderModal');
                openAuthModal();
                return;
            }

            const trx = document.getElementById('ordTrx').value;
            const amount = document.getElementById('ordAmount').value;
            const phone = document.getElementById('ordPhone').value;

            if(!trx || !amount) {
                alert('Please provide Transaction ID and Amount');
                return;
            }

            const newOrder = {
                id: Math.floor(Math.random() * 100000),
                userEmail: currentUser.email,
                userName: document.getElementById('ordName').value,
                userPhone: phone,
                type: type,
                itemId: id,
                itemName: name,
                amount: amount,
                method: document.getElementById('ordMethod').value,
                trxId: trx,
                status: 'Pending',
                date: new Date().toISOString()
            };

            DB.orders.push(newOrder);
            saveData();
            
            closeModal('orderModal');
            alert('Order Placed Successfully! We will contact you soon.');
            showPage('orders');
        }

        // --- AUTH SYSTEM ---
        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function handleLogin() {
            const email = document.getElementById('authEmail').value;
            const user = { email: email, name: email.split('@')[0], phone: '01700000000' };
            
            let existingUser = DB.users.find(u => u.email === email);
            if(!existingUser) {
                DB.users.push(user);
                saveData();
            }
            
            currentUser = user;
            localStorage.setItem('so_current_user', JSON.stringify(user));
            
            closeModal('authModal');
            document.getElementById('authLink').innerText = user.name;
            
            // Check if admin email
            if(email === ADMIN_EMAIL) {
                showPage('admin');
            } else {
                showPage('home');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('so_current_user');
            document.getElementById('authLink').innerText = 'Login';
            showPage('home');
        }

        // Initialize
        showPage('home');

    </script>
</body>
</html>
